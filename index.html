<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TANAW — Pamana ng Kahapon, Kaalaman Ngayon, Kultura sa Sunod na Henerasyon</title>
<meta name="description" content="TANAW: isang digital na aklat ng mga Sagugurang na Pagtubod (lokal na pamahiin) ng Ligao City sa binyag, pag-aasawa, pagbubuntis at panganganak, at kamatayan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --wood1:#eccf9e; --wood2:#dcae6c; --wood3:#c08e4e;
  --paper:#fbf3de; --ink:#3a2a18; --muted:#8a6a3f;
  --accent:#b5822c;
  --tb-bg:rgba(38,24,12,.94); --tb-fg:#f3e6c8; --tb-fg-dim:#c9a869; --tb-hover:rgba(255,232,180,.14);
  --page-w:min(43vw,600px); --page-h:min(68vw,780px,calc(100vh - 140px));
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"EB Garamond",Georgia,serif;color:var(--ink);
  background:
    linear-gradient(180deg,rgba(255,248,230,.4) 0%,rgba(240,208,150,.22) 45%,rgba(190,140,70,.4) 100%),
    url('mayonbg.jpg') center 60%/cover no-repeat,
    linear-gradient(135deg,var(--wood1),var(--wood2) 55%,var(--wood3));
  overflow:hidden;
}
button{font:inherit;background:none;border:none;cursor:pointer;color:inherit}
.landing{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:
    linear-gradient(180deg,rgba(255,248,230,.5) 0%,rgba(240,208,150,.32) 45%,rgba(190,140,70,.62) 100%),
    url('mayonbg.jpg') center 68%/cover no-repeat,
    linear-gradient(135deg,var(--wood1),var(--wood2) 55%,var(--wood3));
  transition:opacity .5s,visibility .5s
}
.landing.hide{opacity:0;visibility:hidden}
.cover{
  width:min(84vw,660px);min-height:min(76vh,460px);border-radius:16px;padding:36px;
  color:var(--ink);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,250,232,.9),transparent 55%),
    linear-gradient(135deg,#fff6e0,#f7e6bd 45%,#f0dba3);
  border:4px double var(--accent);box-shadow:0 30px 60px rgba(60,35,10,.35),inset 0 0 0 1px #fff7e2;
}
.cover-kicker{font:italic 500 16px "Cormorant Garamond",serif;letter-spacing:.16em;color:#8a5a1e;text-transform:uppercase}
.cover-title{font:800 clamp(42px,7.5vw,72px)/1.05 "Playfair Display",serif;margin:12px 0;color:#7a2530;letter-spacing:.01em}
.cover-study{font:italic 600 20px "Cormorant Garamond",serif;max-width:520px;line-height:1.4;color:#6e4320;margin:2px 0 6px}
.cover-orn{font-size:34px;margin:14px 0;color:var(--accent)}
.cover-sub{font:15px "EB Garamond",serif;max-width:500px;line-height:1.35;color:#7a5a34}
.open-btn{
  margin-top:18px;padding:13px 26px;border-radius:999px;border:1px solid #e6c66e;
  background:linear-gradient(#d9a63c,#b5822c);color:#fffaf0;font-family:"EB Garamond",serif;font-weight:600;
  letter-spacing:.07em;font-size:15px;cursor:pointer;box-shadow:0 8px 18px rgba(90,55,20,.3)
}
.open-btn:hover{filter:brightness(1.08)}
.viewer{
  height:100%;display:flex;flex-direction:column;
  background:
    linear-gradient(180deg,rgba(255,248,230,.4) 0%,rgba(240,208,150,.22) 45%,rgba(190,140,70,.4) 100%),
    url('mayonbg.jpg') center 60%/cover no-repeat,
    linear-gradient(135deg,var(--wood1),var(--wood2) 55%,var(--wood3));
}
.viewer:fullscreen{width:100vw;height:100vh}
.viewer::backdrop{
  background:
    linear-gradient(180deg,rgba(255,248,230,.4) 0%,rgba(240,208,150,.22) 45%,rgba(190,140,70,.4) 100%),
    url('mayonbg.jpg') center 60%/cover no-repeat,
    linear-gradient(135deg,var(--wood1),var(--wood2) 55%,var(--wood3));
}
.topbar{
  flex:none;height:50px;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--tb-bg);color:#e3c98f;font:italic 500 16px/1.2 "Cormorant Garamond",serif;letter-spacing:.03em;
  border-bottom:1px solid rgba(255,232,180,.16);text-shadow:0 1px 3px rgba(0,0,0,.5);
  padding:0 14px;text-align:center;
}
.topbar b{font-family:"Playfair Display",serif;color:#f8e3a8;font-weight:800;font-size:23px;letter-spacing:.01em;margin-right:8px}

.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;perspective:2400px;perspective-origin:50% 48%;}
.book-wrap{position:relative;display:flex;align-items:center;justify-content:center;transition:transform .25s ease;}
.book-wrap.zoom-2{transform:scale(1.18)}
.book-wrap.zoom-3{transform:scale(1.38)}

.book{
  position:relative;display:flex;width:calc(var(--page-w)*2);height:var(--page-h);
  transform-style:preserve-3d;
  filter:drop-shadow(0 30px 44px rgba(0,0,0,.55));
  opacity:1;transform:scale(1);transition:opacity .16s ease,transform .16s ease;
}
.book.quick-fade{opacity:0;transform:scale(.98)}
.page{
  width:var(--page-w);height:var(--page-h);position:relative;overflow:hidden;
  background:var(--paper);border:1px solid rgba(0,0,0,.08);
}
.page.left{border-radius:2px 0 0 2px;box-shadow:inset -14px 0 22px rgba(0,0,0,.06)}
.page.right{border-radius:0 2px 2px 0;box-shadow:inset 14px 0 22px rgba(0,0,0,.06)}
.page:after,.turn-face:after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:15;
  background:
    linear-gradient(120deg,rgba(255,255,255,.46) 0%,rgba(255,255,255,0) 24%,rgba(255,255,255,0) 70%,rgba(255,255,255,.24) 100%),
    radial-gradient(130% 65% at 12% -8%, rgba(255,255,255,.32), transparent 55%);
  mix-blend-mode:screen;opacity:.5;
}
.spine-gutter{
  position:absolute;left:50%;top:0;bottom:0;width:20px;transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.18),rgba(255,255,255,.10),rgba(0,0,0,.16),rgba(0,0,0,0));
  z-index:6;pointer-events:none
}
.page-inner{position:absolute;inset:0;padding:34px 38px 30px;display:flex;flex-direction:column}
.running{font:italic 500 13px "Cormorant Garamond",serif;color:var(--muted);letter-spacing:.1em;border-bottom:1px solid rgba(0,0,0,.08);padding-bottom:7px;margin-bottom:12px;text-transform:uppercase}
.page-head{font-family:"Playfair Display",serif;font-weight:700;color:var(--ink);font-size:24px;line-height:1.18;margin:3px 0 14px}
.page-body{font-size:15px;line-height:1.5;overflow-x:hidden;overflow-y:auto;flex:1;color:#2a2a2a;scrollbar-width:thin;scrollbar-color:rgba(138,106,63,.45) transparent}
.page-body strong{font-weight:700;color:var(--ink)}
.page-body p.item{display:flex;gap:8px;text-align:left;margin:0 0 7px}
.page-body p.item .item-n{flex:0 0 auto;min-width:22px;font-weight:700;color:var(--accent)}
.page-body p.item.lvl1{margin-left:28px;margin-bottom:3px}
.page-body p.item.lvl1 .item-n{font-weight:600;min-width:18px}
.toc-link{display:flex;align-items:baseline;gap:6px;padding:5px 0;color:var(--ink) !important;text-decoration:none !important;font-weight:600}
.toc-link.lvl1{padding-left:22px;font-weight:400}
.toc-link:hover span:first-child{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.toc-dots{flex:1;border-bottom:1px dotted rgba(58,42,24,.35);transform:translateY(-4px);min-width:16px}
.book-title{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6px}
.bt-main{font:900 clamp(44px,6vw,78px)/1 "Playfair Display",serif;letter-spacing:.14em;color:#7a2530}
.bt-orn{font-size:28px;color:var(--accent);margin:14px 0}
.bt-sub{font:italic 600 21px/1.4 "Cormorant Garamond",serif;color:#6e4320;max-width:400px}
.bt-place{margin-top:22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chart-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin:0 0 10px;color:#4a3a28}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend .sw{display:inline-block;width:11px;height:11px;border-radius:2px}
.s1{background:#7a2530}.s2{background:#c9962e}.s3{background:#6f7d4a}
.chart-row{margin-bottom:9px}
.chart-label{font-size:12px;line-height:1.25;margin-bottom:3px;color:#2a2a2a}
.chart-bar-line{display:flex;align-items:center;gap:5px;height:10px;margin-bottom:1px}
.chart-bar{height:7px;border-radius:0 2px 2px 0;min-width:2px}
.chart-val{font-size:9.5px;line-height:1;color:#5a4a38;font-variant-numeric:tabular-nums}
.chart-src{font-size:10.5px;font-style:italic;color:var(--muted);margin-top:8px}
.page-body.has-more{-webkit-mask-image:linear-gradient(to bottom,#000 86%,transparent);mask-image:linear-gradient(to bottom,#000 86%,transparent)}
@media (max-height:820px){
  .chart-legend{margin-bottom:6px}
  .chart-row{margin-bottom:5px}
  .chart-label{font-size:11px;margin-bottom:1px}
  .chart-bar-line{height:7px}
  .chart-bar{height:5px}
  .chart-val{font-size:9px}
}
.page-body p{margin:0 0 9px;text-align:justify}
.page-body h4{font-family:"Playfair Display",serif;font-size:14.5px;color:var(--ink);margin:11px 0 5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.page-body a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.page.is-refs .page-body{font-size:12px;line-height:1.32}
.page.is-refs .page-body p{margin-bottom:8px;overflow-wrap:anywhere}
.folio{display:flex;justify-content:center;margin-top:8px;color:var(--muted);font:12px "EB Garamond",serif}
.folio-num{min-width:30px;text-align:center}

.turn-sheet{
  --turn-angle:180deg;--turn-sign:-1;
  position:absolute;top:0;height:100%;width:var(--page-w);z-index:9;
  transform-style:preserve-3d;visibility:hidden;pointer-events:none;
  will-change:transform,filter;backface-visibility:visible;
}
.turn-sheet.right-turn{left:50%;transform-origin:left center;--turn-sign:-1}
.turn-sheet.left-turn{left:0;transform-origin:right center;--turn-sign:1}
.turn-sheet.anim{visibility:visible;pointer-events:auto;animation:flipRight .36s ease-out forwards}
.turn-sheet.anim.left{animation-name:flipLeft}
.turn-face{
  position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
  background:var(--paper);border:1px solid rgba(0,0,0,.08);
  box-shadow:inset 0 0 22px rgba(0,0,0,.05);
  transform-style:preserve-3d;
}
.turn-face.back{transform:rotateY(180deg)}
.turn-face:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:20;
  background:linear-gradient(90deg,rgba(0,0,0,.22) 0%,rgba(0,0,0,.03) 11%,transparent 35%,rgba(255,255,255,.16) 58%,rgba(0,0,0,.05) 82%,rgba(0,0,0,.16) 100%);
  opacity:0;transition:opacity .1s;
}
.turn-sheet:after{
  content:"";position:absolute;top:0;bottom:0;width:34%;opacity:0;pointer-events:none;z-index:30;
  background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.10) 24%,rgba(0,0,0,.34) 50%,rgba(0,0,0,.08) 76%,transparent 100%);
  filter:blur(5px);
}
.turn-sheet.anim .turn-face:before{animation:pageLight .36s ease-out both}
.turn-sheet.anim:after{animation:curlShadow .36s ease-out both}

@keyframes pageLight{0%{opacity:.06}50%{opacity:.32}100%{opacity:.03}}
@keyframes curlShadow{0%{opacity:0;transform:translateX(0) scaleX(.8)}50%{opacity:.42;transform:translateX(45%) scaleX(1.05)}100%{opacity:0;transform:translateX(200%) scaleX(.8)}}
@keyframes flipRight{
  0%{visibility:visible;transform:rotateY(0deg) translateZ(0) scaleX(1)}
  50%{transform:rotateY(-90deg) translateZ(14px) scaleX(.84)}
  100%{transform:rotateY(-180deg) translateZ(0) scaleX(1)}
}
@keyframes flipLeft{
  0%{visibility:visible;transform:rotateY(0deg) translateZ(0) scaleX(1)}
  50%{transform:rotateY(90deg) translateZ(14px) scaleX(.84)}
  100%{transform:rotateY(180deg) translateZ(0) scaleX(1)}
}

.edge-nav{
  position:absolute;top:0;bottom:0;width:9%;min-width:44px;z-index:11;
  display:flex;align-items:center;
  color:rgba(255,255,255,.5);font-size:36px;transition:background .15s,color .15s;
}
.edge-nav.prev{left:0;justify-content:flex-start;padding-left:8px}
.edge-nav.next{right:0;justify-content:flex-end;padding-right:8px}
.edge-nav:hover{background:linear-gradient(90deg,rgba(0,0,0,.18),transparent);color:#fff}
.edge-nav.next:hover{background:linear-gradient(270deg,rgba(0,0,0,.18),transparent)}
.edge-nav[disabled]{opacity:0;pointer-events:none}

.toolbar{
  flex:none;min-height:52px;display:flex;align-items:center;justify-content:center;gap:20px;
  padding:6px 14px;background:var(--tb-bg);border-top:1px solid rgba(255,255,255,.06);
  flex-wrap:wrap;position:relative;z-index:15;
}
.tb-group{display:flex;align-items:center;gap:2px}
.tb-btn{
  width:34px;height:34px;border-radius:6px;display:grid;place-items:center;
  color:var(--tb-fg-dim);transition:background .12s,color .12s;
}
.tb-btn svg{width:18px;height:18px}
.tb-btn:hover{background:var(--tb-hover);color:var(--tb-fg)}
.tb-btn.active{color:var(--accent);background:rgba(47,143,224,.16)}
.tb-page{display:flex;align-items:center;gap:5px;color:var(--tb-fg-dim);font:13px/1 "EB Garamond",serif;margin:0 4px}
.tb-page input{
  width:44px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  border-radius:4px;color:var(--tb-fg);font:13px/1 "EB Garamond",serif;padding:7px 2px;
}
.tb-page input::-webkit-outer-spin-button,.tb-page input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.tb-slider{
  --pct:0%;width:min(220px,26vw);min-width:110px;height:22px;margin:0 2px;
  appearance:none;background:transparent;cursor:pointer;
}
.tb-slider::-webkit-slider-runnable-track{
  height:5px;border-radius:99px;
  background:linear-gradient(90deg,#e9c15a var(--pct),rgba(255,255,255,.18) var(--pct));
  border:1px solid rgba(233,193,90,.5);
}
.tb-slider::-moz-range-track{
  height:5px;border-radius:99px;
  background:linear-gradient(90deg,#e9c15a var(--pct),rgba(255,255,255,.18) var(--pct));
  border:1px solid rgba(233,193,90,.5);
}
.tb-slider::-webkit-slider-thumb{
  appearance:none;width:15px;height:15px;margin-top:-5.5px;border-radius:50%;
  border:2px solid #f1d27f;background:radial-gradient(circle at 35% 30%,#fff0b0,#c38c31 62%,#71451f);
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.tb-slider::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;
  border:2px solid #f1d27f;background:radial-gradient(circle at 35% 30%,#fff0b0,#c38c31 62%,#71451f);
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}

.thumb-panel{
  position:fixed;left:0;right:0;bottom:52px;max-height:min(58vh,520px);
  background:var(--tb-bg);border-top:1px solid rgba(255,255,255,.08);
  transform:translateY(16px);opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease,visibility 0s linear .2s;z-index:20;
  display:flex;flex-direction:column;
}
.thumb-panel.open{
  transform:translateY(0);opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .2s ease,transform .2s ease,visibility 0s linear 0s;
}
.thumb-panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;color:var(--tb-fg);font:13px "EB Garamond",serif;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06)}
.thumb-panel-head button{width:26px;height:26px;display:grid;place-items:center;border-radius:5px;color:var(--tb-fg-dim)}
.thumb-panel-head button:hover{background:var(--tb-hover);color:var(--tb-fg)}
.thumb-grid{overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.thumb-item{cursor:pointer;text-align:center}
.thumb-item .thumb-card{
  aspect-ratio:.72;background:var(--paper);border-radius:3px;padding:8px 7px;overflow:hidden;
  border:2px solid transparent;box-shadow:0 3px 10px rgba(0,0,0,.4);
  font-size:6.2px;line-height:1.25;color:#555;text-align:left;
}
.thumb-item .thumb-card b{display:block;font-size:7.4px;color:#222;margin-bottom:3px}
.thumb-item.active .thumb-card{border-color:var(--accent)}
.thumb-item span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:6px;font-size:11px;line-height:1.3;color:var(--tb-fg-dim)}
.thumb-item:hover span{color:var(--tb-fg)}

.search-panel{
  position:fixed;top:44px;right:14px;width:min(320px,86vw);
  background:var(--tb-bg);border:1px solid rgba(255,255,255,.1);border-radius:8px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:25;display:none;flex-direction:column;overflow:hidden;
}
.search-panel.open{display:flex}
.search-panel input{
  border:none;background:rgba(255,255,255,.08);color:var(--tb-fg);padding:11px 13px;font:14px "EB Garamond",serif;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.search-results{max-height:280px;overflow-y:auto}
.search-results .sr-item{padding:9px 13px;color:var(--tb-fg-dim);font-size:13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.search-results .sr-item b{color:var(--accent);font-weight:600}
.search-results .sr-item:hover{background:var(--tb-hover);color:var(--tb-fg)}
.search-results .sr-empty{padding:14px;color:var(--tb-fg-dim);font-size:12px;text-align:center}

.toast{
  position:fixed;left:50%;bottom:74px;transform:translate(-50%,12px);
  background:rgba(20,20,22,.96);color:#eee;padding:9px 16px;border-radius:999px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:880px){
  body{overflow:auto}
  .topbar{height:auto;min-height:42px;font-size:12px;padding:6px 10px;line-height:1.3}
  .topbar b{font-size:15px;display:block}
  .book{width:min(94vw,600px);height:min(126vw,760px)}
  .book .page.left,.book .page.right{display:none}
  .book .page.single{display:block;width:100%;height:100%}
  .book .spine-gutter{display:none}
  .book{--page-w:min(94vw,600px);--page-h:min(126vw,760px)}
  .turn-sheet{width:100% !important;left:0 !important;transform-origin:center !important}
  .turn-sheet.right-turn{animation-name:flipSingleRight}
  .turn-sheet.left-turn{animation-name:flipSingleLeft}
  @keyframes flipSingleRight{0%{transform:rotateY(0) translateZ(0) scaleX(1)}50%{transform:rotateY(-90deg) translateZ(14px) scaleX(.84)}100%{transform:rotateY(-180deg) translateZ(0) scaleX(1)}}
  @keyframes flipSingleLeft{0%{transform:rotateY(0) translateZ(0) scaleX(1)}50%{transform:rotateY(90deg) translateZ(14px) scaleX(.84)}100%{transform:rotateY(180deg) translateZ(0) scaleX(1)}}
  .edge-nav{width:15%;font-size:28px}
  .toolbar{gap:6px;padding:6px 4px}
  .tb-btn{width:29px;height:29px}
  .tb-btn svg{width:16px;height:16px}
  .tb-slider{width:min(150px,42vw);min-width:80px}
  .page-inner{padding:22px 18px 18px}
  .page-head{font-size:17px}
  .page-body{font-size:13.6px}
  .thumb-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto !important;animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="landing" id="landing">
  <div class="cover">
    <button class="open-btn" id="openBook">Buksan ang Aklat</button>
  </div>
</div>
<div class="viewer" id="viewer">
  <div class="topbar"></div>

  <div class="stage" id="stage">
    <button class="edge-nav prev" id="edgePrev" aria-label="Nakaraang pahina">&lsaquo;</button>
    <div class="book-wrap" id="bookWrap">
      <div class="book" id="book">
        <div class="page left" id="leftPage"></div>
        <div class="page right" id="rightPage"></div>
        <div class="page single" id="singlePage"></div>
        <div class="spine-gutter"></div>

<script>
const PAGES = [{"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}, {"head": "", "nodes": []}];
const TOTAL = PAGES.length;
const landingRemoved = true;
const viewerEl = document.getElementById('viewer');
const stageEl = document.getElementById('stage');
const bookWrap = document.getElementById('bookWrap');
const bookEl = document.getElementById('book');
const leftEl = document.getElementById('leftPage');
const rightEl = document.getElementById('rightPage');
const singleEl = document.getElementById('singlePage');
const turnR = document.getElementById('turnSheetR');
const turnL = document.getElementById('turnSheetL');
const turnFrontR = document.getElementById('turnFrontR');
const turnBackR = document.getElementById('turnBackR');
const turnFrontL = document.getElementById('turnFrontL');
const turnBackL = document.getElementById('turnBackL');
const pageSlider = document.getElementById('pageSlider');
const pageRange = document.getElementById('pageRange');
const totalPagesEl = document.getElementById('totalPages');
const landingEl = document.getElementById('landing');

const searchPanel = document.getElementById('searchPanel');
const searchInput = document.getElementById('searchInput');

const toastEl = document.getElementById('toast');

const soundBtn = document.getElementById('soundBtn');

const isMobile = () => window.matchMedia('(max-width:880px)').matches;
let index = 0;
let busy = false;
let zoomLevel = 1;
let autoplayTimer = null;
let soundOn = false;
let toastTimer = 0;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeUrl(text){
  const m = text.match(/https?:\/\/\S+/);
  return m ? m[0].replace(/[)\],.;]+$/,'') : null;
}
// Supports **bold** and *italic* inside paragraph text.
function appendInline(el, text){
  String(text).split(/(\*\*[^*]+\*\*|\*[^*]+\*)/).forEach(part=>{
    if(!part) return;
    if(part.startsWith('**')){ const b=document.createElement('strong'); b.textContent=part.slice(2,-2); el.appendChild(b); }
    else if(part.startsWith('*') && part.length>2){ const i=document.createElement('em'); i.textContent=part.slice(1,-1); el.appendChild(i); }
    else el.appendChild(document.createTextNode(part));
  });
}
const CHART_SERIES = [['Alam na Alam','s1'],['Di-gaanong Alam','s2'],['Hindi Alam / Walang Alam','s3']];
function buildLegend(){
  const lg=document.createElement('div'); lg.className='chart-legend';
  CHART_SERIES.forEach(([name,cls])=>{
    const s=document.createElement('span');
    const sw=document.createElement('i'); sw.className='sw '+cls;
    s.append(sw,document.createTextNode(name)); lg.appendChild(s);
  });
  return lg;
}
function buildChart(node){
  const wrap=document.createElement('div'); wrap.className='chart';
  wrap.appendChild(buildLegend());
  const max=Math.max(...node.rows.flatMap(r=>r.slice(1)));
  const scale=Math.ceil(max/10)*10;
  node.rows.forEach(r=>{
    const row=document.createElement('div'); row.className='chart-row';
    const lbl=document.createElement('div'); lbl.className='chart-label'; lbl.textContent=r[0];
    row.appendChild(lbl);
    r.slice(1).forEach((v,i)=>{
      const line=document.createElement('div'); line.className='chart-bar-line';
      const bar=document.createElement('div'); bar.className='chart-bar '+CHART_SERIES[i][1];
      bar.style.width=(v/scale*100)+'%';
      bar.title=CHART_SERIES[i][0]+': '+v;
      const val=document.createElement('span'); val.className='chart-val'; val.textContent=v;
      line.append(bar,val); row.appendChild(line);
    });
    wrap.appendChild(row);
  });
  const cap=document.createElement('div'); cap.className='chart-src';
  cap.textContent='Bilang ng mga respondente · Pinagmulan: '+node.src;
  wrap.appendChild(cap);
  return wrap;
}
function renderPage(page, num, extraClass=''){
  const el = document.createElement('div');
  el.className = `page-inner ${extraClass}`;
  const run = document.createElement('div');
  run.className='running';
  run.textContent = page.run || page.head || '';
  const h = document.createElement('div');
  h.className='page-head';
  h.textContent = page.head || '';
  const body = document.createElement('div');
  body.className='page-body';
  for(const node of page.nodes){
    if(node.t==='h'){
      const hh=document.createElement('h4'); hh.textContent=node.x; body.appendChild(hh);
    }else if(node.t==='title'){
      const t=document.createElement('div'); t.className='book-title';
      const big=document.createElement('div'); big.className='bt-main'; big.textContent=node.x;
      const orn=document.createElement('div'); orn.className='bt-orn'; orn.textContent='❦';
      const sub=document.createElement('div'); sub.className='bt-sub'; sub.textContent=node.sub;
      const place=document.createElement('div'); place.className='bt-place'; place.textContent='Mga Sagugurang na Pagtubod ng Ligao City';
      t.append(big,orn,sub,place); body.appendChild(t);
    }else if(node.t==='item'){
      const p=document.createElement('p'); p.className='item lvl'+(node.lvl||0);
      const n=document.createElement('span'); n.className='item-n'; n.textContent=node.n;
      const tx=document.createElement('span'); appendInline(tx,node.x);
      p.append(n,tx); body.appendChild(p);
    }else if(node.t==='toc'){
      const a=document.createElement('a'); a.href='#'; a.className='toc-link lvl'+(node.lvl||0);
      const target=PAGES.findIndex(pg=>pg.id===node.to);
      const lbl=document.createElement('span'); lbl.textContent=node.x;
      const dots=document.createElement('span'); dots.className='toc-dots';
      const num=document.createElement('span'); num.textContent=target+1;
      a.append(lbl,dots,num);
      a.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); stopAutoplay(); quickJump(target); });
      body.appendChild(a);
    }else if(node.t==='legend'){
      body.appendChild(buildLegend());
    }else if(node.t==='chart'){
      body.appendChild(buildChart(node));
    }else{
      const p=document.createElement('p');
      const raw=node.x;
      const url=safeUrl(raw);
      if(url){
        const before=raw.slice(0,raw.indexOf(url));
        const after=raw.slice(raw.indexOf(url)+url.length);
        p.append(document.createTextNode(before));
        const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; a.textContent=url;
        p.append(a,document.createTextNode(after));
      }else{
        appendInline(p,raw);
      }
      body.appendChild(p);
    }
  }
  const f=document.createElement('div'); f.className='folio';
  const fn=document.createElement('span'); fn.className='folio-num'; fn.textContent=num;
  f.appendChild(fn);
  if(run.textContent) el.append(run);
  if(h.textContent) el.append(h);
  el.append(body,f);
  return el;
}
function putPage(el, page, num){
  el.innerHTML='';
  const inner=renderPage(page,num,page.isRefs?'is-refs':'');
  el.appendChild(inner);
  el.classList.toggle('is-refs',!!page.isRefs);
  // Fade the bottom edge when a page's text runs past what fits, as a cue to scroll.
  const pb=inner.querySelector('.page-body');
  const mark=()=>pb.classList.toggle('has-more', pb.scrollTop + pb.clientHeight < pb.scrollHeight - 4);
  pb.addEventListener('scroll',mark,{passive:true});
  requestAnimationFrame(mark);
}
function currentVisiblePage(){
  return isMobile() ? index+1 : Math.min(TOTAL,index+1);
}
function updatePageIndicator(){
  const pageNo = Math.max(1, Math.min(TOTAL, currentVisiblePage()));
  pageSlider.value = pageNo;
  pageRange.value = pageNo;
  const pct = TOTAL>1 ? ((pageNo-1)/(TOTAL-1))*100 : 0;
  pageRange.style.setProperty('--pct', pct+'%');
}
function updateThumbActive(){
  const cards = thumbGrid.children;
  for(let i=0;i<cards.length;i++) cards[i].classList.toggle('active', i===index);
}
function buildThumbnails(){
  thumbGrid.innerHTML='';
  const frag = document.createDocumentFragment();
  PAGES.forEach((p,i)=>{
    const item=document.createElement('div');
    item.className='thumb-item'+(i===index?' active':'');
    const card=document.createElement('div');
    card.className='thumb-card';
    const snippet=((p.nodes[0]&&p.nodes[0].x)||'').replace(/\*/g,'');
    card.innerHTML = '<b>'+escapeHtml(p.head||'')+'</b>'+escapeHtml(snippet.slice(0,150));
    const label=document.createElement('span');
    label.textContent=(i+1)+'. '+(p.head||'Pahina '+(i+1));
    item.append(card,label);
    item.addEventListener('click',()=>{ stopAutoplay(); quickJump(i); closeThumbs(); });
    frag.appendChild(item);
  });
  thumbGrid.appendChild(frag);
}
function refresh(){
  if(isMobile()){
    leftEl.style.display='none'; rightEl.style.display='none'; singleEl.style.display='block';
    putPage(singleEl,PAGES[index],index+1);
  }else{
    leftEl.style.display='block'; rightEl.style.display='block'; singleEl.style.display='none';
    const left=index % 2 === 0 ? index : Math.max(0,index-1);
    const right=Math.min(TOTAL-1,left+1);
    putPage(leftEl,PAGES[left],left+1); putPage(rightEl,PAGES[right],right+1);
  }
  updatePageIndicator();
  updateThumbActive();
  history.replaceState(null,'','#p='+(index+1));
}
function fillSheet(sheet,front,back,frontEl,backEl){
  frontEl.innerHTML=''; backEl.innerHTML='';
  frontEl.appendChild(renderPage(front,front.num||1));
  backEl.appendChild(renderPage(back,back.num||1));
}
function makeSheetPage(page,num){
  return {...page,num};
}
function playFlipSound(){
  if(!soundOn) return;
  try{
    const ctx = window.__ac || (window.__ac = new (window.AudioContext||window.webkitAudioContext)());
    const dur=.15, n=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*(1-i/n);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const filt=ctx.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=900;
    const gain=ctx.createGain(); gain.gain.value=.16;
    src.connect(filt).connect(gain).connect(ctx.destination);
    src.start();
  }catch(e){}
}
function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200);
}
function next(){
  if(busy) return;
  if(isMobile()){
    if(index>=TOTAL-1) return;
    busy=true;
    fillSheet(turnR,makeSheetPage(PAGES[index],index+1),makeSheetPage(PAGES[index+1],index+2),turnFrontR,turnBackR);
    turnR.classList.remove('anim'); void turnR.offsetWidth; playFlipSound(); turnR.classList.add('anim');
    setTimeout(()=>{index++; refresh(); turnR.classList.remove('anim'); busy=false},360);
  }else{
    if(index+2>=TOTAL) return;
    busy=true;
    const right=index+1;
    fillSheet(turnR,makeSheetPage(PAGES[right],right+1),makeSheetPage(PAGES[right+1],right+2),turnFrontR,turnBackR);
    turnR.classList.remove('anim'); void turnR.offsetWidth; playFlipSound(); turnR.classList.add('anim');
    setTimeout(()=>{index+=2; refresh(); turnR.classList.remove('anim'); busy=false},360);
  }
}
function prev(){
  if(busy) return;
  if(isMobile()){
    if(index<=0) return;
    busy=true;
    fillSheet(turnL,makeSheetPage(PAGES[index],index+1),makeSheetPage(PAGES[index-1],index),turnFrontL,turnBackL);
    playFlipSound(); turnL.classList.add('anim','left');
    setTimeout(()=>{index--; refresh(); turnL.classList.remove('anim','left'); busy=false},360);
  }else{
    if(index<=0) return;
    busy=true;
    const left=Math.max(0,index-1);
    const back=Math.max(0,left-1);
    fillSheet(turnL,makeSheetPage(PAGES[left],left+1),makeSheetPage(PAGES[back],back+1),turnFrontL,turnBackL);
    playFlipSound(); turnL.classList.add('anim','left');
    setTimeout(()=>{index=Math.max(0,index-2); refresh(); turnL.classList.remove('anim','left'); busy=false},360);
  }
}
function quickJump(target){
  if(busy) return;
  const desired = Math.max(0, Math.min(TOTAL-1, Number(target)));
  const finalIndex = isMobile() ? desired : (desired%2===0 ? desired : desired-1);
  if(finalIndex === index) return;
  busy = true;
  bookEl.classList.add('quick-fade');
  setTimeout(()=>{
    index = finalIndex;
    refresh();
    requestAnimationFrame(()=>{
      bookEl.classList.remove('quick-fade');
      setTimeout(()=>{busy=false},160);
    });
  },140);
}
function jumpTo(target, animate=true){
  const desired = Math.max(0, Math.min(TOTAL-1, Number(target)));
  const finalIndex = isMobile() ? desired : (desired%2===0 ? desired : desired-1);
  if(!animate || finalIndex === index || busy){
    index = finalIndex;
    refresh();
    return;
  }
  const direction = finalIndex > index ? 1 : -1;
  let steps = isMobile() ? Math.abs(finalIndex-index) : Math.abs(finalIndex-index)/2;
  steps = Math.min(steps, 8);

  busy = true;
  let completed = 0;

  const doOne = () => {
    if(completed >= steps){
      index = finalIndex;
      refresh();
      busy = false;
      return;
    }
    if(direction > 0){
      const nextIndex = isMobile() ? index+1 : index+2;
      if(nextIndex > TOTAL-1){ busy=false; return; }
      const frontNum = nextIndex-1, backNum = nextIndex;
      fillSheet(turnR, makeSheetPage(PAGES[frontNum], frontNum+1), makeSheetPage(PAGES[backNum], backNum+1), turnFrontR, turnBackR);
      turnR.classList.remove('anim'); void turnR.offsetWidth; playFlipSound(); turnR.classList.add('anim');
      setTimeout(()=>{
        index = nextIndex; completed++; refresh(); turnR.classList.remove('anim');
        requestAnimationFrame(doOne);
      },360);
    }else{
      const prevIndex = isMobile() ? index-1 : index-2;
      if(prevIndex < 0){ busy=false; return; }
      const frontIndex = isMobile() ? index : Math.max(0,index-1);
      const backIndex = Math.max(0,prevIndex);
      fillSheet(turnL, makeSheetPage(PAGES[frontIndex], frontIndex+1), makeSheetPage(PAGES[backIndex], backIndex+1), turnFrontL, turnBackL);
      playFlipSound(); turnL.classList.add('anim','left');
      setTimeout(()=>{
        index = prevIndex; completed++; refresh(); turnL.classList.remove('anim','left');
        requestAnimationFrame(doOne);
      },360);
    }
  };
  doOne();
}

function stopAutoplay(){
  if(!autoplayTimer) return;
  clearInterval(autoplayTimer); autoplayTimer=null;
  autoplayBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20" fill="currentColor" stroke="none"/></svg>';
  autoplayBtn.classList.remove('active');
}
function toggleAutoplay(){
  if(autoplayTimer){ stopAutoplay(); return; }
  autoplayBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"/></svg>';
  autoplayBtn.classList.add('active');
  autoplayTimer = setInterval(()=>{
    if(index>=TOTAL-1){ stopAutoplay(); return; }
    next();
  }, 2800);
}
function toggleSound(){
  soundOn = !soundOn;
  soundBtn.innerHTML = soundOn ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M17 8a5 5 0 010 8"/><path d="M19.5 5.5a9 9 0 010 13"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
  soundBtn.classList.toggle('active', soundOn);
}
function toggleFullscreen(){
  if(!document.fullscreenElement){
    (viewerEl.requestFullscreen ? viewerEl.requestFullscreen() : Promise.resolve()).catch(()=>{});
  }else{
    document.exitFullscreen && document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', ()=>{
  fullscreenBtn.classList.toggle('active', !!document.fullscreenElement);
});
function setZoom(level){
  zoomLevel = Math.max(1, Math.min(3, level));
  bookWrap.classList.remove('zoom-2','zoom-3');
  if(zoomLevel===2) bookWrap.classList.add('zoom-2');
  if(zoomLevel===3) bookWrap.classList.add('zoom-3');
}
function openThumbs(){ buildThumbnails(); thumbPanel.classList.add('open'); }
function closeThumbs(){ thumbPanel.classList.remove('open'); }
function toggleThumbs(){ thumbPanel.classList.contains('open') ? closeThumbs() : openThumbs(); }

function renderSearchResults(q, results){
  searchResults.innerHTML='';
  if(!q){ searchResults.innerHTML='<div class="sr-empty">Mag-type upang maghanap sa mga pahina.</div>'; return; }
  if(!results.length){ searchResults.innerHTML='<div class="sr-empty">Walang nahanap na tugma.</div>'; return; }
  const frag=document.createDocumentFragment();
  results.slice(0,40).forEach(i=>{
    const div=document.createElement('div');
    div.className='sr-item';
    div.innerHTML = '<b>Pahina '+(i+1)+'</b> — '+escapeHtml(PAGES[i].head||'');
    div.addEventListener('click',()=>{ stopAutoplay(); quickJump(i); closeSearch(); });
    frag.appendChild(div);
  });
  searchResults.appendChild(frag);
}
function doSearch(q){
  q=(q||'').trim().toLowerCase();
  const results=[];
  if(q){
    PAGES.forEach((p,i)=>{
      const text=(p.head+' '+p.nodes.map(n=>n.x).join(' ')).toLowerCase();
      if(text.includes(q)) results.push(i);
    });
  }
  renderSearchResults(q, results);
}
function openSearch(){ searchPanel.classList.add('open'); searchInput.focus(); doSearch(searchInput.value); }
function closeSearch(){ searchPanel.classList.remove('open'); }
function toggleSearch(){ searchPanel.classList.contains('open') ? closeSearch() : openSearch(); }

function doShare(){
  const url = location.origin+location.pathname+'#p='+(index+1);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>showToast('Nakopya ang link ng pahina.')).catch(()=>showToast(url));
  }else{
    showToast(url);
  }
}
function doDownload(){ window.print(); }

pageSlider.max = TOTAL;
pageRange.max = TOTAL;
totalPagesEl.textContent = TOTAL;

openBtn.addEventListener('click',()=>landingEl.classList.add('hide'));
document.getElementById('edgePrev').addEventListener('click',()=>{stopAutoplay(); prev();});
document.getElementById('edgeNext').addEventListener('click',()=>{stopAutoplay(); next();});
document.getElementById('tbPrevBtn').addEventListener('click',()=>{stopAutoplay(); prev();});
document.getElementById('tbNextBtn').addEventListener('click',()=>{stopAutoplay(); next();});
document.getElementById('firstBtn').addEventListener('click',()=>{stopAutoplay(); quickJump(0);});
document.getElementById('lastBtn').addEventListener('click',()=>{stopAutoplay(); quickJump(TOTAL-1);});
document.getElementById('thumbsBtn').addEventListener('click', toggleThumbs);
document.getElementById('closeThumbs').addEventListener('click', closeThumbs);
document.getElementById('searchBtn').addEventListener('click', toggleSearch);
document.getElementById('zoomInBtn').addEventListener('click',()=>setZoom(zoomLevel+1));
document.getElementById('zoomOutBtn').addEventListener('click',()=>setZoom(zoomLevel-1));
autoplayBtn.addEventListener('click', toggleAutoplay);
soundBtn.addEventListener('click', toggleSound);
fullscreenBtn.addEventListener('click', toggleFullscreen);
document.getElementById('shareBtn').addEventListener('click', doShare);
document.getElementById('downloadBtn').addEventListener('click', doDownload);
searchInput.addEventListener('input', e=>doSearch(e.target.value));

let sliderDebounce = 0;
function onPageInput(value, immediate){
  const targetPage = Number(value) - 1;
  pageRange.value = value; pageSlider.value = value;
  const pct = TOTAL>1 ? ((Number(value)-1)/(TOTAL-1))*100 : 0;
  pageRange.style.setProperty('--pct', pct+'%');
  clearTimeout(sliderDebounce);
  if(immediate){ stopAutoplay(); jumpTo(targetPage, true); }
  else sliderDebounce = setTimeout(()=>{ stopAutoplay(); jumpTo(targetPage, true); }, 45);
}
pageSlider.addEventListener('input', (e)=>onPageInput(e.target.value, false));
pageSlider.addEventListener('change', (e)=>onPageInput(e.target.value, true));
pageRange.addEventListener('input', (e)=>onPageInput(e.target.value, false));
pageRange.addEventListener('change', (e)=>onPageInput(e.target.value, true));

let lastWheelAt = 0;
function onWheelPage(e){
  // Let an overflowing page scroll its own text before the wheel flips pages.
  const pb = e.target.closest && e.target.closest('.page-body');
  if(pb && pb.scrollHeight > pb.clientHeight + 2){
    const dy = e.deltaY || 0;
    if((dy > 0 && pb.scrollTop + pb.clientHeight < pb.scrollHeight - 1) || (dy < 0 && pb.scrollTop > 0)) return;
  }
  e.preventDefault();
  e.stopPropagation();
  const delta = e.deltaY || e.deltaX;
  if(!delta) return;
  const now = Date.now();
  if(now - lastWheelAt < 260) return;
  lastWheelAt = now;
  stopAutoplay();
  if(delta > 0) next(); else prev();
}
const pageNavGroup = document.getElementById('pageNavGroup');
pageNavGroup.addEventListener('wheel', onWheelPage, {passive:false});
pageRange.addEventListener('wheel', onWheelPage, {passive:false});
pageSlider.addEventListener('wheel', onWheelPage, {passive:false});
stageEl.addEventListener('wheel', onWheelPage, {passive:false});

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){e.preventDefault(); stopAutoplay(); next();}
  if(e.key==='ArrowLeft'){e.preventDefault(); stopAutoplay(); prev();}
  if(e.key==='Escape'){ closeThumbs(); closeSearch(); }
});
bookEl.addEventListener('click',e=>{
  const r=bookEl.getBoundingClientRect();
  const x=e.clientX-r.left;
  stopAutoplay();
  if(isMobile()){ x<r.width/2 ? prev() : next(); return; }
  if(x<r.width*.32) prev();
  else if(x>r.width*.68) next();
});
window.addEventListener('resize', refresh);

const hashMatch = location.hash.match(/p=(\d+)/);
if(hashMatch){
  let start = Math.max(0, Math.min(TOTAL-1, parseInt(hashMatch[1],10)-1));
  index = isMobile() ? start : (start%2===0 ? start : start-1);
}
refresh();
</script>
